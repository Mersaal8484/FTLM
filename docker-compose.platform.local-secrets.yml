# Local development only. Keep and back up this volume: losing its key prevents
# decrypting existing tenant credentials. Production should use managed secrets.
services:
  admin:
    environment:
      TenantProvisioning__KeyDirectory: /run/fueltrack-keys
      TenantProvisioning__KeyId: local-v1
    volumes:
      - type: volume
        source: tenant_keys
        target: /run/fueltrack-keys
        read_only: true
volumes:
  tenant_keys:
    external: true
    name: ftm-platform_tenant_keys
