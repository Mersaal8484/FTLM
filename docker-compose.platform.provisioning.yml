# Optional development override. Supply a trusted, private secrets directory.
services:
  admin:
    environment:
      TenantProvisioning__KeyDirectory: /run/fueltrack-keys
      TenantProvisioning__KeyId: "${PLATFORM_TENANT_KEY_ID:?Set PLATFORM_TENANT_KEY_ID}"
    volumes:
      - type: bind
        source: "${PLATFORM_SECRETS_DIR:?Set PLATFORM_SECRETS_DIR}"
        target: /run/fueltrack-keys
        read_only: true
