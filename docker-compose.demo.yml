# Local-only demo. The API is reachable only from this computer, and SignalR is disabled.
services:
  admin:
    environment:
      Platform__LocalDemoEnabled: "true"
  api:
    build:
      context: .
      dockerfile: src/FuelTrack.API/Dockerfile
      args:
        DOTNET_SDK_IMAGE: "${DOTNET_SDK_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0}"
        NUGET_SOURCE: "${NUGET_SOURCE:-https://api.nuget.org/v3/index.json}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MultiTenancy__Enabled: "true"
      MultiTenancy__LocalDemo: "true"
      ConnectionStrings__Platform: "Host=postgres;Database=fueltrack_platform;Username=fueltrack_platform;Password=${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD}"
      ConnectionStrings__TenantDatabase: "Host=postgres;Database=fueltrack_platform"
      TenantCredentials__KeyDirectory: /run/fueltrack-keys
      JwtSettings__Key: "${DEMO_JWT_KEY:?Set DEMO_JWT_KEY}"
      DataEncryption__Key: "${DEMO_DATA_KEY:?Set DEMO_DATA_KEY}"
    volumes:
      - type: volume
        source: tenant_keys
        target: /run/fueltrack-keys
        read_only: true
    ports:
      - "127.0.0.1:5001:8080"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_LOCAL_DEMO: "true"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend/nginx.demo.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: demo.localhost' http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
