services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: model_proof
      POSTGRES_USER: proof_admin
      POSTGRES_PASSWORD: local_disposable_proof
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof_admin -d model_proof"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  proof:
    build:
      context: ../..
      dockerfile: tests/PostgresModel.Proof/Dockerfile
      args:
        NUGET_SOURCE: "${NUGET_SOURCE:-https://api.nuget.org/v3/index.json}"
    environment:
      PROOF_DATABASE: "Host=postgres;Database=model_proof;Username=proof_admin;Password=local_disposable_proof"
    depends_on:
      postgres:
        condition: service_healthy
