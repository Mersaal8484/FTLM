apiVersion: v1
kind: Secret
metadata:
  name: fueltrack-secrets
  namespace: fueltrack
type: Opaque
stringData:
  SA_PASSWORD: "<your-sql-server-password>"
  JWT_SECRET: "<generate-with: openssl rand -base64 64>"
  SMTP_PASSWORD: "<your-smtp-password>"
  ACCEPT_EULA: "Y"
  db-connection-string: "Server=fueltrack-sqlserver,1433;Database=FuelTrackDb;User Id=sa;Password=<your-sql-server-password>;TrustServerCertificate=True;"
