apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fueltrack-sqlserver
  labels:
    app.kubernetes.io/name: fueltrack-sqlserver
    app.kubernetes.io/component: database
spec:
  serviceName: fueltrack-sqlserver
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fueltrack-sqlserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fueltrack-sqlserver
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
              protocol: TCP
          env:
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fueltrack-secrets
                  key: SA_PASSWORD
            - name: ACCEPT_EULA
              valueFrom:
                secretKeyRef:
                  name: fueltrack-secrets
                  key: ACCEPT_EULA
            - name: MSSQL_PID
              value: "Developer"
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "2048"
          livenessProbe:
            exec:
              command:
                - /opt/mssql-tools/bin/sqlcmd
                - -S
                - localhost
                - -U
                - sa
                - -P
                - $(SA_PASSWORD)
                - -Q
                - "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - /opt/mssql-tools/bin/sqlcmd
                - -S
                - localhost
                - -U
                - sa
                - -P
                - $(SA_PASSWORD)
                - -Q
                - "SELECT 1"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: sqlserver-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fueltrack-sqlserver
  labels:
    app.kubernetes.io/name: fueltrack-sqlserver
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: fueltrack-sqlserver
  ports:
    - port: 1433
      targetPort: 1433
      protocol: TCP
      name: mssql
