apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fueltrack-ingress
  labels:
    app.kubernetes.io/name: fueltrack
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fueltrack.example.com
      secretName: fueltrack-tls
  rules:
    - host: fueltrack.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: fueltrack-api
                port:
                  number: 80
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: fueltrack-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fueltrack-frontend
                port:
                  number: 80
