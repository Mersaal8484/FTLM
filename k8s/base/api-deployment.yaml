apiVersion: apps/v1
kind: Deployment
metadata:
  name: fueltrack-api
  labels:
    app.kubernetes.io/name: fueltrack-api
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fueltrack-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fueltrack-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: fueltrack-api:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__FuelTrackDb
              valueFrom:
                secretKeyRef:
                  name: fueltrack-secrets
                  key: db-connection-string
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: fueltrack-secrets
                  key: JWT_SECRET
            - name: JwtSettings__Issuer
              value: "fueltrack"
            - name: JwtSettings__Audience
              value: "fueltrack"
            - name: JwtSettings__ExpiryMinutes
              value: "60"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          emptyDir: {}

