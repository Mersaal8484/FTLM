apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fueltrack-prod

resources:
  - ../../base

namePrefix: prod-
commonLabels:
  environment: prod

patches:
  - target:
      kind: Namespace
      name: fueltrack
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: fueltrack
        labels:
          environment: prod

  - target:
      kind: Deployment
      name: fueltrack-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fueltrack-api
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "250m"
                  limits:
                    memory: "1Gi"
                    cpu: "1000m"

  - target:
      kind: Deployment
      name: fueltrack-frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fueltrack-frontend
      spec:
        replicas: 3

  - target:
      kind: StatefulSet
      name: fueltrack-sqlserver
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: fueltrack-sqlserver
      spec:
        template:
          spec:
            containers:
              - name: sqlserver
                resources:
                  requests:
                    memory: "2Gi"
                    cpu: "1000m"
                  limits:
                    memory: "4Gi"
                    cpu: "2000m"
        volumeClaimTemplates:
          - metadata:
              name: sqlserver-data
            spec:
              resources:
                requests:
                  storage: 50Gi

  - target:
      kind: Ingress
      name: fueltrack-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: fueltrack-ingress
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
      spec:
        tls:
          - hosts:
              - fueltrack.example.com
            secretName: fueltrack-prod-tls
        rules:
          - host: fueltrack.example.com
