apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fueltrack-dev

resources:
  - ../../base

namePrefix: dev-
commonLabels:
  environment: dev

patches:
  - target:
      kind: Namespace
      name: fueltrack
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: fueltrack
        labels:
          environment: dev

  - target:
      kind: Deployment
      name: fueltrack-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fueltrack-api
      spec:
        replicas: 1

  - target:
      kind: Deployment
      name: fueltrack-frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fueltrack-frontend
      spec:
        replicas: 1

  - target:
      kind: StatefulSet
      name: fueltrack-sqlserver
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: fueltrack-sqlserver
      spec:
        template:
          spec:
            containers:
              - name: sqlserver
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "250m"
                  limits:
                    memory: "1Gi"
                    cpu: "500m"
        volumeClaimTemplates:
          - metadata:
              name: sqlserver-data
            spec:
              resources:
                requests:
                  storage: 5Gi

  - target:
      kind: Ingress
      name: fueltrack-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: fueltrack-ingress
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-staging
      spec:
        tls:
          - hosts:
              - fueltrack-dev.example.com
            secretName: fueltrack-dev-tls
        rules:
          - host: fueltrack-dev.example.com
