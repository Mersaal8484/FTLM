services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Jaeger collector HTTP
      - "14250:14250" # Jaeger collector gRPC
      - "9411:9411"   # Zipkin
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411

  api:
    build:
      context: .
      dockerfile: src/FuelTrack.API/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=FuelTrack;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      JwtSettings__Key: "${JWT_KEY:?JWT_KEY is required}"
      JwtSettings__Issuer: "${JWT_ISSUER:-FuelTrackAPI}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-FuelTrackApp}"
      AdminSettings__DefaultPassword: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: "${REACT_APP_API_URL:-http://localhost:5000}"
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqlserver_data:
