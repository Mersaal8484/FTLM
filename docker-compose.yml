services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/FuelTrack.API/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=FuelTrack;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;MultipleActiveResultSets=true"
      JwtSettings__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      JwtSettings__Issuer: "${JWT_ISSUER:-FuelTrack.API}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-FuelTrack.Clients}"
      AdminSettings__DefaultPassword: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      DataEncryption__Key: "${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN:-http://localhost:3000}"
      Cors__AllowedOrigins__1: "${CORS_ORIGIN:-http://localhost:3000}"
      FrontendBaseUrl: "${CORS_ORIGIN:-http://localhost:3000}"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_started

volumes:
  sqlserver_data:
